[package]
name = "searxng-mcp"
version = "0.1.0"
edition = "2021"
authors = ["Jackson <your.email@example.com>"]
description = "MCP server for SearXNG web search - free, private, multi-engine search for AI agents"
license = "MIT"
repository = "https://github.com/jackson/searxng-mcp"
homepage = "https://github.com/jackson/searxng-mcp"
documentation = "https://github.com/jackson/searxng-mcp/blob/main/README.md"
keywords = ["mcp", "searxng", "search", "llm", "agent", "claude", "ai"]
categories = ["web-programming", "command-line-utilities", "asynchronous"]
rust-version = "1.75"
readme = "README.md"
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "scripts/**/*",
    "docs/**/*",
]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# HTTP client
reqwest = { version = "0.11", features = ["json", "rustls-tls", "gzip", "deflate", "brotli"], default-features = false }

# JSON handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# URL encoding
urlencoding = "2.1"

# HTML parsing
scraper = "0.18"
html2text = "0.12"

# Markdown processing
pulldown-cmark = "0.9"

# Async trait
async-trait = "0.1"

# Futures utilities
futures = "0.3"

# Time
tokio-util = "0.7"

# MCP protocol (following the official spec)
# We'll implement the protocol ourselves for maximum compatibility

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
