name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Build
      shell: bash
      run: |
        cd searxng-mcp-0.1.0
        cargo build --release
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: searxng-mcp-windows-exe
        path: searxng-mcp-0.1.0/target/release/searxng-mcp.exe
